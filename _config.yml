title: Dependable, Efficient, and Intelligent Computing Lab (DETAIL)
# Custom design: own _layouts + assets/css/site.css (no remote theme).

# --- preview-only (do NOT merge upstream) ---
# Served as a project page at https://wdzhwsh4067.github.io/vu-detail.github.io/
baseurl: "/vu-detail.github.io"
url: "https://wdzhwsh4067.github.io"

# --- Reading Notes ---
# Each reading note is a document in the `notes` collection (folder _notes/).
# The Sveltia CMS at /admin/ creates one Markdown file per paper here.
collections:
  notes:
    output: true
    permalink: /notes/:name/

# Give every note the `note` layout automatically (so committed files stay clean).
defaults:
  # All ordinary Markdown pages get the new prose/page layout.
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # Reading-note documents get the single-note layout.
  - scope:
      path: ""
      type: notes
    values:
      layout: note
